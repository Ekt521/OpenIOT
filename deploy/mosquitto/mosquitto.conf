# OpenIOT 本地开发 Broker 配置
#
# 安全提示：下面允许匿名连接，仅适用于本机/家庭内网开发。
# 接入真实设备前必须改为「账号密码认证 + TLS」，并限制监听地址，
# 具体做法见 README 的「上线前必做」章节。
listener 1883 0.0.0.0
allow_anonymous true

# 保留消息与会话持久化，容器重启后设备状态主题不丢
persistence true
persistence_location /mosquitto/data/

# 日志输出到容器标准输出，便于 docker logs 查看
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
