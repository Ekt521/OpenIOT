spring:
  datasource:
    url: jdbc:h2:mem:openiot-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

openiot:
  mqtt:
    # 集成测试连接本机真实 Broker，未启动时测试会自动跳过
    broker-url: tcp://localhost:1883
    client-id: openiot-platform-test
  device:
    offline-threshold-seconds: 120
    command-timeout-seconds: 30
  simulator:
    enabled: false
