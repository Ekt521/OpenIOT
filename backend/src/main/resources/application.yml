server:
  port: 8080

spring:
  application:
    name: openiot-platform
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/openiot}
    username: ${POSTGRES_USER:openiot}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

openiot:
  mqtt:
    # 平台连接的真实 Broker，与 docker-compose 中的 Mosquitto 对应
    broker-url: ${OPENIOT_MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: ${OPENIOT_MQTT_CLIENT_ID:openiot-platform}
    username: ${OPENIOT_MQTT_USERNAME:}
    password: ${OPENIOT_MQTT_PASSWORD:}
    # 设备上报遥测 / 上报命令结果 / 上报在线状态
    telemetry-topic: openiot/+/telemetry
    command-ack-topic: openiot/+/command/ack
    status-topic: openiot/+/status
    # 平台下发命令的主题模板，%s 为设备编号
    command-topic-template: openiot/%s/command
    keep-alive-seconds: 30
    connection-timeout-seconds: 10
  device:
    # 超过该秒数没有收到任何上报，即判定设备离线
    offline-threshold-seconds: 90
  security:
    # MVP 单一管理员账号。真实值放在被 Git 忽略的 application-local.yml 中。
    admin-email: ${OPENIOT_SECURITY_ADMIN_EMAIL:}
    admin-password: ${OPENIOT_SECURITY_ADMIN_PASSWORD:}
    admin-name: ${OPENIOT_SECURITY_ADMIN_NAME:管理员}
  tv:
    # 小米电视局域网适配器。电视地址与设备编号放在本地配置中。
    enabled: ${OPENIOT_TV_ENABLED:false}
    ip: ${OPENIOT_TV_IP:127.0.0.1}
    port: ${OPENIOT_TV_PORT:6095}
    code: ${OPENIOT_TV_CODE:}
    name: ${OPENIOT_TV_NAME:电视}
    product-name: ${OPENIOT_TV_PRODUCT_NAME:电视}
    location: ${OPENIOT_TV_LOCATION:}
    timeout-millis: ${OPENIOT_TV_TIMEOUT_MILLIS:3000}
    poll-interval-millis: ${OPENIOT_TV_POLL_INTERVAL_MILLIS:15000}
