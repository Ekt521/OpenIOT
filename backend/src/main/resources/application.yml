server:
  port: 8080

spring:
  application:
    name: openiot-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/openiot
    username: openiot
    password: openiot
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

openiot:
  mqtt:
    # 平台连接的真实 Broker，与 docker-compose 中的 Mosquitto 对应
    broker-url: tcp://localhost:1883
    client-id: openiot-platform
    username: ""
    password: ""
    # 设备上报遥测 / 上报命令结果 / 上报在线状态
    telemetry-topic: openiot/+/telemetry
    command-ack-topic: openiot/+/command/ack
    status-topic: openiot/+/status
    # 平台下发命令的主题模板，%s 为设备编号
    command-topic-template: openiot/%s/command
    keep-alive-seconds: 30
    connection-timeout-seconds: 10
  device:
    # 超过该秒数没有收到任何上报，即判定设备离线
    offline-threshold-seconds: 90
  security:
    # MVP 单一管理员账号，接入真实用户体系前先用配置项
    admin-email: lin.yuan@example.com
    admin-password: openiot
    admin-name: 林远
  tv:
    # 小米电视局域网适配器。电视 IP 由路由器 DHCP 分配，地址变了改这里并重启后端。
    enabled: true
    ip: 192.168.0.101
    port: 6095
    code: MI-TV-L55M5AD
    name: 客厅的小米电视
    product-name: 小米电视
    location: 一层 · 客厅
    timeout-millis: 3000
    poll-interval-millis: 15000
